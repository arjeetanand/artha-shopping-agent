<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dikhao - Show what inspires you</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }
        
        .screen.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* LANDING */
        .landing {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .landing h1 {
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .landing p {
            font-size: 18px;
            margin-bottom: 20px;
            opacity: 0.95;
            line-height: 1.6;
        }
        
        .btn {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .btn-secondary {
            background: #667eea;
            color: white;
            margin-top: 12px;
        }
        
        .btn-secondary:hover {
            background: #5a6fd8;
        }
        
        .btn-success {
            background: #22c55e;
            color: white;
        }
        
        .btn-success:hover {
            background: #16a34a;
        }
        
        .btn-danger {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .btn-danger:hover {
            background: #e5e5e5;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* FORMS */
        .form-group {
            margin-bottom: 30px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .upload-zone {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 2px dashed #ddd;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-zone:hover {
            border-color: #667eea;
        }
        
        .upload-zone img {
            max-height: 200px;
            max-width: 100%;
            border-radius: 8px;
        }
        
        textarea, input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .file-input {
            display: none;
        }
        
        /* CARDS */
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #ddd;
            margin-bottom: 16px;
        }
        
        .card.featured {
            border: 2px solid #667eea;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        
        .card-subtitle {
            font-size: 13px;
            color: #999;
            margin: 4px 0 0;
        }
        
        .price {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }
        
        .rating {
            font-size: 12px;
            color: #999;
        }
        
        /* TAGS & BADGES */
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
            margin-bottom: 6px;
        }
        
        .badge-success {
            background: #dbeafe;
            color: #667eea;
        }
        
        .badge-warning {
            background: #fef3c7;
            color: #f59e0b;
        }
        
        .badge-primary {
            background: #667eea;
            color: white;
        }
        
        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .stat {
            background: #f9fafb;
            padding: 16px;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        /* PROGRESS BAR */
        .progress-bar {
            background: #f0f0f0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-fill {
            background: #667eea;
            height: 100%;
            transition: width 0.3s;
        }
        
        /* TIMELINE */
        .timeline {
            position: relative;
        }
        
        .timeline-item {
            display: flex;
            margin-bottom: 24px;
        }
        
        .timeline-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 12px;
            margin-right: 20px;
            flex-shrink: 0;
        }
        
        .timeline-marker.completed {
            background: #22c55e;
        }
        
        .timeline-line {
            position: absolute;
            left: 11px;
            top: 24px;
            width: 2px;
            height: 40px;
            background: #e5e7eb;
        }
        
        .timeline-line.completed {
            background: #22c55e;
        }
        
        .timeline-content p {
            margin: 0;
            line-height: 1.4;
        }
        
        .timeline-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .timeline-time {
            font-size: 13px;
            color: #999;
        }
        
        /* SUCCESS STATE */
        .success-box {
            background: #f0fdf4;
            border: 1px solid #86efac;
            padding: 16px;
            border-radius: 8px;
            margin: 30px 0;
            text-align: center;
        }
        
        .success-box p {
            color: #166534;
            font-weight: 600;
            margin: 0;
        }
        
        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        /* PAGE HEADERS */
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }
        
        .page-header p {
            color: #666;
            font-size: 16px;
        }
        
        /* UTILITY */
        .text-center {
            text-align: center;
        }
        
        .mt-20 {
            margin-top: 20px;
        }
        
        .mb-30 {
            margin-bottom: 30px;
        }
        
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .muted {
            color: #999;
            font-size: 13px;
        }
        
        .warning {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px;
            border-radius: 4px;
            margin: 16px 0;
        }
        
        /* HEADER */
        .app-header {
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }
        
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .landing h1 {
                font-size: 36px;
            }
            
            .landing p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        const app = {
            state: {
                screen: 'landing',
                uploadedImage: null,
                textInput: '',
                voiceInput: '',
                aiIntent: null,
                products: [],
                selectedProduct: null,
                orderID: null,
                orderStatus: 'placed'
            },
            
            setScreen(name) {
                this.state.screen = name;
                this.render();
            },
            
            analyzeInput() {
                const { uploadedImage, textInput, voiceInput } = this.state;
                if (!uploadedImage && !textInput && !voiceInput) return;
                
                // Mock AI Intent
                const mockIntent = {
                    category: 'fashion',
                    subcategory: 'shoes',
                    style: 'minimalist',
                    occasion: 'daily',
                    budget: 5000,
                    mustHave: ['comfortable', 'durable'],
                    preferred: ['waterproof', 'sustainable'],
                    description: textInput || voiceInput || 'Image analyzed'
                };
                
                // Mock Products
                const mockProducts = [
                    {
                        id: 1,
                        name: 'Premium White Sneaker',
                        brand: 'StyleCraft',
                        price: 4999,
                        rating: 4.8,
                        stock: 12,
                        features: ['Comfortable', 'Durable', 'Lightweight'],
                        matchScore: 98,
                        matchReasons: ['Matches minimalist style', 'Within budget', 'Highly rated']
                    },
                    {
                        id: 2,
                        name: 'Classic Leather Sneaker',
                        brand: 'Heritage Co',
                        price: 6500,
                        rating: 4.6,
                        stock: 5,
                        features: ['Premium Leather', 'Durable', 'Vintage'],
                        matchScore: 85,
                        matchReasons: ['Great style match']
                    },
                    {
                        id: 3,
                        name: 'Sport Performance Shoe',
                        brand: 'ActiveGear',
                        price: 3999,
                        rating: 4.4,
                        stock: 20,
                        features: ['Waterproof', 'Comfortable', 'Sporty'],
                        matchScore: 72,
                        matchReasons: ['Budget-friendly', 'Good stock']
                    }
                ];
                
                this.state.aiIntent = mockIntent;
                this.state.products = mockProducts;
                this.setScreen('intent');
            },
            
            selectProduct(product) {
                this.state.selectedProduct = product;
                this.setScreen('constraints');
            },
            
            confirmPurchase() {
                const mockOrder = {
                    id: 'ORD' + Date.now(),
                    product: this.state.selectedProduct,
                    total: this.state.selectedProduct.price,
                    tax: Math.round(this.state.selectedProduct.price * 0.18),
                    shipping: 99
                };
                
                this.state.orderID = mockOrder.id;
                this.state.orderStatus = 'placed';
                this.setScreen('success');
                
                setTimeout(() => {
                    this.state.orderStatus = 'confirmed';
                    this.render();
                }, 2000);
                
                setTimeout(() => {
                    this.state.orderStatus = 'shipped';
                    this.render();
                }, 4000);
            },
            
            trackOrder() {
                this.setScreen('tracking');
            },
            
            reset() {
                this.state = {
                    screen: 'landing',
                    uploadedImage: null,
                    textInput: '',
                    voiceInput: '',
                    aiIntent: null,
                    products: [],
                    selectedProduct: null,
                    orderID: null,
                    orderStatus: 'placed'
                };
                this.render();
            },
            
            handleImageUpload(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        this.state.uploadedImage = event.target.result;
                        this.render();
                    };
                    reader.readAsDataURL(file);
                }
            },
            
            startVoiceRecording() {
                // Mock voice input
                this.state.voiceInput = 'Show me minimalist white sneakers';
                this.render();
            },
            
            render() {
                const appEl = document.getElementById('app');
                
                let html = '';
                
                if (this.state.screen === 'landing') {
                    html = `
                        <div class="landing">
                            <div>
                                <h1>Dikhao</h1>
                                <p style="font-size: 24px; margin-bottom: 30px;">Show what inspires you. We'll find what to buy.</p>
                                <p style="font-size: 16px; line-height: 1.6; margin-bottom: 40px;">Upload an image from Instagram, describe what you want, or speak it out. Our AI understands your style and finds the perfect product.</p>
                                <button class="btn btn-primary" onclick="app.setScreen('input')">Start Shopping</button>
                            </div>
                        </div>
                    `;
                }
                
                else if (this.state.screen === 'input') {
                    html = `
                        <div class="app-header">
                            <div class="app-title">Dikhao</div>
                            <button class="btn btn-danger" onclick="app.reset()" style="padding: 8px 16px;">Close</button>
                        </div>
                        <div class="container" style="padding: 40px 20px;">
                            <div class="page-header">
                                <h2>Tell us what inspires you</h2>
                                <p>Upload an image, describe it, or record your voice</p>
                            </div>
                            
                            <div class="form-group">
                                <div class="upload-zone" onclick="document.getElementById('image-input').click()">
                                    ${this.state.uploadedImage 
                                        ? `<img src="${this.state.uploadedImage}" alt="Uploaded"><p style="margin-top: 10px; color: #667eea; font-weight: 600;">Click to change image</p>`
                                        : `<div style="font-size: 40px; margin-bottom: 10px;">📸</div><p style="font-size: 16px; font-weight: 600; margin: 0 0 5px;">Upload an image</p><p style="font-size: 14px; color: #999; margin: 0;">From Instagram, Pinterest, or your camera</p>`
                                    }
                                </div>
                                <input type="file" id="image-input" class="file-input" accept="image/*" onchange="app.handleImageUpload(event)">
                            </div>
                            
                            <div class="form-group">
                                <label>Or describe what you want</label>
                                <textarea placeholder="E.g., minimalist white sneakers, durable leather bag..." onchange="app.state.textInput = this.value; app.render()">${this.state.textInput}</textarea>
                            </div>
                            
                            <div class="form-group">
                                <label>Or record your voice</label>
                                <button class="btn btn-secondary" style="width: 100%;" onclick="app.startVoiceRecording()">🎤 Record voice</button>
                                ${this.state.voiceInput ? `<p style="margin-top: 10px; color: #667eea; font-size: 14px;">✓ Heard: "${this.state.voiceInput}"</p>` : ''}
                            </div>
                            
                            <div style="display: flex; gap: 12px;">
                                <button class="btn btn-secondary" style="flex: 1;" ${!this.state.uploadedImage && !this.state.textInput && !this.state.voiceInput ? 'disabled' : ''} onclick="app.analyzeInput()">Find Products</button>
                                <button class="btn btn-danger" style="flex: 1;" onclick="app.reset()">Cancel</button>
                            </div>
                        </div>
                    `;
                }
                
                else if (this.state.screen === 'intent') {
                    const intent = this.state.aiIntent;
                    html = `
                        <div class="app-header">
                            <div class="app-title">Dikhao</div>
                        </div>
                        <div class="container" style="padding: 40px 20px;">
                            <div class="page-header">
                                <h2>Here's what we understand</h2>
                                <p>AI analyzed your request and found ${this.state.products.length} matching products</p>
                            </div>
                            
                            <div class="card">
                                <div class="grid">
                                    <div class="stat">
                                        <div class="stat-label">CATEGORY</div>
                                        <div class="stat-value">${intent.category}</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-label">STYLE</div>
                                        <div class="stat-value">${intent.style}</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-label">BUDGET</div>
                                        <div class="stat-value">₹${intent.budget.toLocaleString()}</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-label">OCCASION</div>
                                        <div class="stat-value">${intent.occasion}</div>
                                    </div>
                                </div>
                                
                                <div style="border-top: 1px solid #eee; padding-top: 16px;">
                                    <p style="font-size: 12px; color: #999; font-weight: 600; margin: 0 0 8px;">MUST-HAVE</p>
                                    <div style="margin-bottom: 16px;">
                                        ${intent.mustHave.map(item => `<span class="badge badge-success">✓ ${item}</span>`).join('')}
                                    </div>
                                    
                                    <p style="font-size: 12px; color: #999; font-weight: 600; margin: 0 0 8px;">PREFERRED</p>
                                    <div>
                                        ${intent.preferred.map(item => `<span class="badge" style="background: #f0f0f0; color: #666;">◇ ${item}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                            
                            <button class="btn btn-secondary" style="width: 100%; margin-bottom: 12px;" onclick="app.setScreen('comparison')">Compare ${this.state.products.length} Products</button>
                            <button class="btn btn-danger" style="width: 100%;" onclick="app.reset()">Start Over</button>
                        </div>
                    `;
                }
                
                else if (this.state.screen === 'comparison') {
                    html = `
                        <div class="app-header">
                            <div class="app-title">Dikhao</div>
                        </div>
                        <div class="container" style="padding: 40px 20px;">
                            <div class="page-header">
                                <h2>Ranked by match score</h2>
                                <p>Sorted by how well each product matches your style and budget</p>
                            </div>
                            
                            ${this.state.products.map((product, index) => `
                                <div class="card ${index === 0 ? 'featured' : ''}">
                                    <div class="card-header">
                                        <div>
                                            ${index === 0 ? '<p style="color: #667eea; font-size: 12px; font-weight: 600; margin: 0 0 4px;">BEST MATCH</p>' : ''}
                                            <p class="card-title">${product.name}</p>
                                            <p class="card-subtitle">${product.brand}</p>
                                        </div>
                                        <div style="text-align: right;">
                                            <div class="price">₹${product.price.toLocaleString()}</div>
                                            <p class="rating">⭐ ${product.rating}/5</p>
                                        </div>
                                    </div>
                                    
                                    <div class="grid">
                                        <div>
                                            <p class="stat-label">MATCH SCORE</p>
                                            <div class="progress-bar">
                                                <div class="progress-fill" style="width: ${product.matchScore}%"></div>
                                            </div>
                                            <p style="font-size: 13px; font-weight: 600; margin: 4px 0 0; color: #333;">${product.matchScore}%</p>
                                        </div>
                                        <div>
                                            <p class="stat-label">STOCK</p>
                                            <p style="font-size: 16px; font-weight: 600; color: ${product.stock > 5 ? '#22c55e' : '#f97316'};">${product.stock} available</p>
                                        </div>
                                    </div>
                                    
                                    <div style="margin: 16px 0;">
                                        <p class="stat-label">WHY THIS MATCHES</p>
                                        <ul style="margin: 0; padding-left: 20px; font-size: 13px;">
                                            ${product.matchReasons.map(reason => `<li style="color: #22c55e; margin-bottom: 4px;">✓ ${reason}</li>`).join('')}
                                        </ul>
                                    </div>
                                    
                                    <button class="btn btn-secondary" style="width: 100%;" onclick="app.selectProduct(${JSON.stringify(product).replace(/"/g, '&quot;')})">Check constraints</button>
                                </div>
                            `).join('')}
                            
                            <button class="btn btn-danger" style="width: 100%; margin-top: 20px;" onclick="app.reset()">Start Over</button>
                        </div>
                    `;
                }
                
                else if (this.state.screen === 'constraints') {
                    const product = this.state.selectedProduct;
                    const intent = this.state.aiIntent;
                    const verifyConstraints = [
                        { name: 'Budget', status: product.price <= intent.budget, value: `₹${product.price} ≤ ₹${intent.budget}` },
                        { name: 'In Stock', status: product.stock > 0, value: `${product.stock} units available` },
                        { name: 'Availability', status: true, value: 'Ships within 2-3 days' },
                        { name: 'Must-have Features', status: true, value: product.features.slice(0, 2).join(', ') }
                    ];
                    
                    const total = product.price + Math.round(product.price * 0.18) + 99;
                    
                    html = `
                        <div class="app-header">
                            <div class="app-title">Dikhao</div>
                        </div>
                        <div class="container" style="padding: 40px 20px;">
                            <div class="page-header">
                                <h2>Constraint verification</h2>
                                <p>All hard constraints verified before purchase</p>
                            </div>
                            
                            <div class="card">
                                ${verifyConstraints.map((c, i) => `
                                    <div style="padding: 16px; ${i < verifyConstraints.length - 1 ? 'border-bottom: 1px solid #eee;' : ''} display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <p style="font-size: 14px; font-weight: 600; margin: 0 0 4px; color: #333;">${c.name}</p>
                                            <p style="font-size: 13px; color: #999; margin: 0;">${c.value}</p>
                                        </div>
                                        <span style="font-size: 20px;">${c.status ? '✅' : '❌'}</span>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <div class="success-box">
                                <p>✓ All constraints satisfied. Safe to purchase.</p>
                            </div>
                            
                            <div class="card">
                                <p style="font-size: 12px; color: #999; font-weight: 600; margin: 0 0 12px;">ORDER SUMMARY</p>
                                <div style="font-size: 14px;">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                        <span style="color: #666;">${product.name}</span>
                                        <span style="font-weight: 600;">₹${product.price.toLocaleString()}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #999; font-size: 13px;">
                                        <span>Tax (18%)</span>
                                        <span>₹${Math.round(product.price * 0.18).toLocaleString()}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: #999; font-size: 13px;">
                                        <span>Shipping</span>
                                        <span>₹99</span>
                                    </div>
                                    <div style="border-top: 1px solid #eee; padding-top: 12px; display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; color: #333;">
                                        <span>Total</span>
                                        <span>₹${total.toLocaleString()}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <button class="btn btn-success" style="width: 100%; margin-bottom: 12px;" onclick="app.confirmPurchase()">Confirm purchase</button>
                            <button class="btn btn-danger" style="width: 100%;" onclick="app.setScreen('comparison')">Back to comparison</button>
                        </div>
                    `;
                }
                
                else if (this.state.screen === 'success') {
                    const icons = { 'placed': '✅', 'confirmed': '📦', 'shipped': '🚚' };
                    const titles = { 'placed': 'Order placed!', 'confirmed': 'Order confirmed!', 'shipped': 'Order shipped!' };
                    const product = this.state.selectedProduct;
                    const deliveryDate = new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toLocaleDateString();
                    
                    html = `
                        <div style="background: #f0fdf4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
                            <div style="background: white; border-radius: 12px; padding: 40px; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                                <div class="success-icon">${icons[this.state.orderStatus]}</div>
                                
                                <h2 style="font-size: 28px; font-weight: 700; color: #22c55e; margin: 0 0 10px;">${titles[this.state.orderStatus]}</h2>
                                <p style="color: #666; margin: 0 0 30px; font-size: 14px; line-height: 1.6;">Your order has been ${this.state.orderStatus}. You'll receive it within 2-3 days.</p>
                                
                                <div class="card">
                                    <div style="margin-bottom: 16px;">
                                        <p class="stat-label">ORDER ID</p>
                                        <p style="font-size: 16px; font-weight: 700; color: #333; margin: 0; font-family: monospace;">${this.state.orderID}</p>
                                    </div>
                                    <div style="margin-bottom: 16px;">
                                        <p class="stat-label">PRODUCT</p>
                                        <p style="font-size: 14px; color: #333; margin: 0;">${product.name}</p>
                                    </div>
                                    <div>
                                        <p class="stat-label">ESTIMATED DELIVERY</p>
                                        <p style="font-size: 14px; color: #333; margin: 0;">${deliveryDate}</p>
                                    </div>
                                </div>
                                
                                <button class="btn btn-secondary" style="width: 100%; margin: 20px 0 12px;" onclick="app.trackOrder()">Track order</button>
                                <button class="btn btn-danger" style="width: 100%;" onclick="app.reset()">Shop again</button>
                            </div>
                        </div>
                    `;
                }
                
                else if (this.state.screen === 'tracking') {
                    const trackingSteps = [
                        { status: 'Order Placed', time: 'Just now', completed: true },
                        { status: 'Payment Confirmed', time: '2 mins ago', completed: this.state.orderStatus !== 'placed' },
                        { status: 'Preparing to Ship', time: 'In progress', completed: this.state.orderStatus === 'shipped' },
                        { status: 'Out for Delivery', time: 'Estimated tomorrow', completed: false }
                    ];
                    
                    html = `
                        <div class="app-header">
                            <div class="app-title">Dikhao</div>
                        </div>
                        <div class="container" style="padding: 40px 20px;">
                            <div class="page-header">
                                <h2>Order tracking</h2>
                                <p>Order ${this.state.orderID}</p>
                            </div>
                            
                            <div class="card">
                                <div class="timeline">
                                    ${trackingSteps.map((step, i) => `
                                        <div class="timeline-item">
                                            <div style="position: relative;">
                                                <div class="timeline-marker ${step.completed ? 'completed' : ''}">
                                                    ${step.completed ? '✓' : i + 1}
                                                </div>
                                                ${i < trackingSteps.length - 1 ? `<div class="timeline-line ${step.completed ? 'completed' : ''}"></div>` : ''}
                                            </div>
                                            <div class="timeline-content">
                                                <p class="timeline-label">${step.status}</p>
                                                <p class="timeline-time">${step.time}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div class="warning">
                                <p style="margin: 0;">💬 We'll notify you when your order ships!</p>
                            </div>
                            
                            <button class="btn btn-secondary" style="width: 100%;" onclick="app.reset()">Continue shopping</button>
                        </div>
                    `;
                }
                
                appEl.innerHTML = html;
            }
        };
        
        // Initialize app
        app.render();
    </script>
</body>
</html>
